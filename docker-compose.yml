version: '3.8'

services:
  db:
    image: postgres:15
    container_name: my_database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - mynetwork
    volumes:
      - ./storage/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./storage/dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "myuser", "-d", "myappdb"]
      interval: 5s
      retries: 5

  web:
    build: .
    container_name: my_django
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - mynetwork
    volumes:
      - .:/app
      - ./logs:/app/logs

networks:
  mynetwork:
