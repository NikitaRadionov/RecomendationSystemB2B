version: '3.8'

services:
  db:
    image: postgres:15
    container_name: my_database
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: myappdb
    ports:
      - "5432:5432"
    networks:
      - mynetwork
    volumes:
      - ./storage/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./storage/dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "myuser", "-d", "myappdb"]
      interval: 5s
      retries: 5

  web:
    build: .
    container_name: my_django
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://myuser:mypassword@db:5432/myappdb
    ports:
      - "8000:8000"
    networks:
      - mynetwork
    volumes:
      - .:/app
      - ./logs:/app/logs

networks:
  mynetwork:
